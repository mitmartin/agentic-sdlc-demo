name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Summarize coverage
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          console.log('## Application coverage\n');
          console.log('| Measure | Coverage |\n| --- | --- |');
          for (const key of ['lines', 'statements', 'functions', 'branches']) {
            console.log(`| ${key} | ${total[key].pct}% |`);
          }
          JS
